name: TrendLine Alerts

# Originally ran check_watchlist.py on a schedule so the Telegram alert
# pipeline didn't depend on a Mac being awake with launchd loaded.
#
# Schedule DISABLED as of 2026-09-12: the alert cycle now runs on a
# persistent Oracle Cloud VM instead (deploy/oci/trendline-alerts.timer,
# every 15 min, same check_watchlist.py). Running both here and there sent
# duplicate Telegram alerts and split Paper Trading's capital ledger across
# two un-synced copies of state (this workflow's ephemeral actions/cache vs.
# the VM's persistent disk). The VM is always-on, so it's the better single
# source of truth -- this workflow is kept only for on-demand manual runs
# (workflow_dispatch) if you ever want to trigger a cycle without touching
# the VM. Re-enable the schedule below if the VM is ever retired.
#
# Cron times are UTC. IST = UTC+5:30, so 9:15-16:00 IST -> ~03:45-10:30 UTC.
# Widened slightly on both ends to be safe against schedule drift.
on:
  # schedule:
  #   - cron: "*/15 3-10 * * 1-5"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

concurrency:
  group: trendline-alerts
  cancel-in-progress: false  # never kill a run mid-cycle; let it finish, skip overlap instead

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore alert state (watchlist/digest dedup state)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/watchlist.json
            data/watchlist_state.json
            data/universe_digest_state.json
            data/active_scan_config.json
            data/cpr_state.json
            data/call_log.csv
            data/paper_trading
          key: trendline-state-${{ github.run_id }}
          restore-keys: |
            trendline-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_watchlist.py

      - name: Save alert state for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/watchlist.json
            data/watchlist_state.json
            data/universe_digest_state.json
            data/active_scan_config.json
            data/cpr_state.json
            data/call_log.csv
            data/paper_trading
          key: trendline-state-${{ github.run_id }}
